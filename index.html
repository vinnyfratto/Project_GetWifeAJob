  <meta name="description" content="Personal CRM for Sarah Mitchell — Medical Coding, Radiology Coder, CPC-A, Texas remote job search.">

  <!-- Prevent FOUC in dark mode -->
  <script>
    try {
      const s = JSON.parse(localStorage.getItem('jt_settings'));
      if (s && s.darkMode) document.documentElement.classList.add('dark');
    } catch(e){}
  </script>

  <link rel="stylesheet" href="css/styles.css?v=16">
</head>

  <div id="app">

    <!-- ── Sidebar (desktop) ── -->
    <aside id="sidebar"></aside>

    <!-- ── Main Content Area ── -->
    <div id="content">

      <!-- ── Topbar ── -->
      <header id="topbar">
        <div style="flex:1;font-family:'Nunito Sans',sans-serif;font-size:17px;font-weight:800;color:var(--accent);letter-spacing:-0.2px;">Project: Find Wife a Job</div>
        <div class="topbar-actions">
          <button class="dark-toggle" onclick="App.applyDarkMode(!document.documentElement.classList.contains('dark')); Storage.Settings.set({darkMode:document.documentElement.classList.contains('dark')})" title="Toggle dark mode">
            🌙
          </button>
          <div class="user-avatar" style="width:36px;height:36px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;">SF</div>
        </div>
      </header>

      <!-- ── View Output ── -->
      <main id="main-content">
        <div style="display:flex;align-items:center;justify-content:center;height:60vh;color:var(--text-muted);font-size:15px;">
          Loading…
        </div>
      </main>

    </div><!-- /content -->
